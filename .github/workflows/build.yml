name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      # Builds from pull requests use the random debug key Android makes by itself. Only builds that are published use the fixed key,
      # so that each new APK installs over the last one.
      - name: Use a fixed debug key so new builds install over old ones
        if: github.event_name != 'pull_request'
        run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug
      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/fitotrack-github-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: fitotrack-github-debug, path: dist/*.apk }

  # Publishing is a separate job, so that only it can write to the repo, and it never runs for a pull request.
  publish:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: fitotrack-github-debug, path: dist }
      - name: Publish rolling release from main
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest dist/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" --notes "Automatic build of main at ${GITHUB_SHA::7}."
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --generate-notes --title "$GITHUB_REF_NAME"
